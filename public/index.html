<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园失物招领平台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/index.html"><span class="brand-logo">寻</span>校园失物招领</a>
    <nav class="nav">
      <a href="/index.html">首页</a>
      <a href="/publish.html">发布信息</a>
      <a href="/my.html">个人中心</a>
      <a href="/admin.html" class="admin-only hidden">审核后台</a>
    </nav>
    <div id="userArea" class="user-area"></div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>让每一件失物，都能找到回家的路</h1>
    <p>发布失物或招领信息，校内同学互相帮助，认领流程全程留痕</p>
    <div class="hero-search">
      <input id="searchInput" type="search" placeholder="搜索物品名称、地点，如：校园卡 / 图书馆">
      <button class="btn btn-primary" id="searchBtn">搜索</button>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <div class="history-row" id="historyRow"></div>

  <div class="section-head">
    <h2>最新发布</h2>
    <a href="#listSection">查看全部 →</a>
  </div>
  <div class="carousel" id="carousel"></div>

  <div id="listSection">
    <div class="filter-bar">
      <div class="tabs" id="typeTabs">
        <button class="tab active" data-type="">全部</button>
        <button class="tab" data-type="lost">失物</button>
        <button class="tab" data-type="found">招领</button>
      </div>
      <div class="spacer"></div>
      <select class="select" id="categorySelect">
        <option value="">全部分类</option>
        <option>证件卡类</option>
        <option>电子产品</option>
        <option>书籍资料</option>
        <option>衣物饰品</option>
        <option>钥匙</option>
        <option>其他</option>
      </select>
      <select class="select" id="sortSelect">
        <option value="latest">最新发布</option>
        <option value="hot">浏览最多</option>
      </select>
    </div>

    <div class="item-grid" id="itemGrid"></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<div class="site-footer" id="siteFooter"></div>

<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
