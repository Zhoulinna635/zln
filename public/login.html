<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 校园失物招领平台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="card auth-card">
  <h1>欢迎回来</h1>
  <p class="sub">登录后可发布信息、收藏、申请认领</p>

  <form id="loginForm">
    <div class="form-item">
      <label for="username">用户名</label>
      <input class="input" id="username" autocomplete="username" placeholder="请输入用户名">
    </div>
    <div class="form-item">
      <label for="password">密码</label>
      <input class="input" id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <p class="error-text" id="errorBox"></p>
    <button class="btn btn-primary btn-block" id="submitBtn" type="submit">登录</button>
  </form>

  <div class="auth-switch">还没有账号？<a href="/register.html">立即注册</a></div>
  <div class="auth-tip">
    演示账号：普通用户 xiaoming / 123456；管理员 admin / 123456
  </div>
  <div class="auth-switch"><a href="/index.html">← 返回首页</a></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
